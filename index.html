<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbit</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(circle at center, #0b0014, #000);
    color: white;
    font-family: 'Orbitron', sans-serif;
    overflow: hidden;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
  }

  .ui {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    gap: 12px;
    padding: 20px;
  }

  .title {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: 6px;
    text-shadow: 0 0 20px #a855f7;
  }

  .subtitle {
    font-size: 14px;
    opacity: 0.7;
  }

  .timebox {
    font-size: 18px;
    padding: 10px 18px;
    border: 1px solid rgba(168,85,247,0.5);
    border-radius: 12px;
    background: rgba(10,0,20,0.4);
  }

  /* PLANETS */
  .planets { position: absolute; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

  .planet {
    position: absolute;
    border-radius: 50%;
    opacity: 0.7;
    animation: float 20s infinite linear;
  }

  .p1 { width: 80px; height: 80px; background: #7c3aed; top: 20%; left: 10%; }
  .p2 { width: 120px; height: 120px; background: #9333ea; top: 70%; left: 80%; animation-duration: 30s; }
  .p3 { width: 60px; height: 60px; background: #a855f7; top: 40%; left: 60%; animation-duration: 25s; }

  @keyframes float {
    0% { transform: translate(0,0) scale(1); }
    50% { transform: translate(40px,-30px) scale(1.1); }
    100% { transform: translate(0,0) scale(1); }
  }

  /* MUSIC PLAYER */
  .music-player {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 380px;
    background: rgba(20, 0, 40, 0.7);
    border: 1px solid rgba(168,85,247,0.4);
    border-radius: 16px;
    padding: 14px;
    z-index: 3;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(168,85,247,0.2);
  }

  .player-top {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }

  .cover {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    object-fit: cover;
    border: 1px solid rgba(168,85,247,0.5);
  }

  .song-title {
    font-size: 13px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  button {
    background: transparent;
    border: 1px solid rgba(168,85,247,0.5);
    color: white;
    padding: 6px 10px;
    border-radius: 10px;
    cursor: pointer;
  }

  button:hover { background: rgba(168,85,247,0.2); }

  .bar {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    overflow: hidden;
  }

  .progress {
    height: 100%;
    width: 0%;
    background: #a855f7;
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="planets">
  <div class="planet p1"></div>
  <div class="planet p2"></div>
  <div class="planet p3"></div>
</div>

<div class="ui">
  <div class="title">ORBIT</div>
  <div class="subtitle">neon space interface</div>
  <div class="timebox" id="time">loading time...</div>
</div>

<!-- MUSIC PLAYER -->
<div class="music-player">

  <div class="player-top">
    <img id="cover" class="cover" src="https://images.unsplash.com/photo-1511379938547-c1f69419868d" />
    <div class="song-title" id="songTitle">Now Playing: Cosmic Drift</div>
  </div>

  <audio id="audio"></audio>

  <div class="controls">
    <button onclick="prevSong()">⏮</button>
    <button onclick="togglePlay()" id="playBtn">▶</button>
    <button onclick="nextSong()">⏭</button>

    <div class="bar">
      <div class="progress" id="progress"></div>
    </div>
  </div>
</div>

<script>
// TIME
function updateTime() {
  const now = new Date();
  document.getElementById("time").innerText = now.toLocaleString();
}
setInterval(updateTime, 1000);
updateTime();

// STAR FIELD
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
let stars = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

for (let i = 0; i < 150; i++) {
  stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.5, d: Math.random()*1 });
}

function drawStars() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "white";
  for (let s of stars) {
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  }
  for (let s of stars) {
    s.y += s.d;
    if (s.y > canvas.height) { s.y = 0; s.x = Math.random()*canvas.width; }
  }
  requestAnimationFrame(drawStars);
}
drawStars();

// MUSIC
const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const cover = document.getElementById("cover");

const songs = [
  {
    title: "Cosmic Drift",
    src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
    cover: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
  },
  {
    title: "Neon Waves",
    src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
    cover: "https://images.unsplash.com/photo-1519681393784-d120267933ba"
  }
];

let current = 0;

function loadSong(i){
  audio.src = songs[i].src;
  document.getElementById("songTitle").innerText = "Now Playing: " + songs[i].title;
  cover.src = songs[i].cover;
}

function togglePlay(){
  if(audio.paused){ audio.play(); playBtn.innerText = "⏸"; }
  else { audio.pause(); playBtn.innerText = "▶"; }
}

function nextSong(){
  current = (current + 1) % songs.length;
  loadSong(current);
  audio.play(); playBtn.innerText = "⏸";
}

function prevSong(){
  current = (current - 1 + songs.length) % songs.length;
  loadSong(current);
  audio.play(); playBtn.innerText = "⏸";
}

audio.addEventListener("timeupdate", () => {
  const percent = (audio.currentTime / audio.duration) * 100;
  progress.style.width = percent + "%";
});

loadSong(current);
</script>

</body>
</html>
