<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orbit OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #120018, #000);
  font-family: Arial, sans-serif;
  color: white;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  background: #0a0010;
  border-right: 1px solid #2a003f;
  padding: 20px;
  box-shadow: 0 0 20px #000;
}

.logo {
  font-size: 28px;
  color: #b026ff;
  text-shadow: 0 0 15px #b026ff;
  margin-bottom: 30px;
}

.nav-item {
  padding: 10px;
  margin: 10px 0;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
  border: 1px solid transparent;
}

.nav-item:hover {
  background: #1a0026;
  border: 1px solid #b026ff;
  box-shadow: 0 0 10px #b026ff;
}

/* MAIN AREA */
.main {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.title {
  font-size: 30px;
  color: #b026ff;
  text-shadow: 0 0 20px #b026ff;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

/* CARDS */
.card {
  background: #0a0010;
  border: 1px solid #2a003f;
  border-radius: 15px;
  padding: 15px;
  cursor: pointer;
  transition: 0.25s;
  position: relative;
  overflow: hidden;
}

.card:hover {
  transform: translateY(-6px);
  border: 1px solid #b026ff;
  box-shadow: 0 0 20px #b026ff;
}

.card h3 {
  margin: 0;
  color: #b026ff;
}

/* MUSIC PLAYER */
.music {
  margin-top: 20px;
  padding: 15px;
  background: #0a0010;
  border: 1px solid #2a003f;
  border-radius: 15px;
  box-shadow: 0 0 10px #000;
}

audio {
  width: 100%;
  margin-top: 10px;
  filter: drop-shadow(0 0 8px #b026ff);
}

/* FOOTER TEXT */
.small {
  color: #666;
  font-size: 12px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">ORBIT</div>

  <div class="nav-item">🏠 Home</div>
  <div class="nav-item">🎮 Games</div>
  <div class="nav-item">🔥 Trending</div>
  <div class="nav-item">⭐ Favorites</div>
  <div class="nav-item">⚙️ Settings</div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <div class="title">Dashboard</div>
    <div class="small">Orbit OS • Neon Edition</div>
  </div>

  <!-- GAME GRID -->
  <div class="grid">

    <div class="card" onclick="openGame('https://example.com')">
      <h3>Action Game</h3>
      <p>Fast paced</p>
    </div>

    <div class="card" onclick="openGame('https://example.com')">
      <h3>Puzzle Game</h3>
      <p>Brain challenge</p>
    </div>

    <div class="card" onclick="openGame('https://example.com')">
      <h3>Retro Game</h3>
      <p>Old school vibes</p>
    </div>

    <div class="card" onclick="openGame('https://example.com')">
      <h3>Arcade</h3>
      <p>Classic feel</p>
    </div>

  </div>

  <!-- MUSIC -->
  <div class="music">
    <h3 style="color:#b026ff; margin:0;">Music Player</h3>
    <audio controls>
      <source src="music.mp3" type="audio/mpeg">
    </audio>
    <div class="small">Upload your own MP3 as music.mp3</div>
  </div>

</div>

<script>
function openGame(url) {
  window.open(url, "_blank");
}
</script>

</body>
</html>
