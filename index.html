<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orbit OS</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  overflow:hidden;
  color:white;
  background:
  radial-gradient(circle at top,#190028 0%,#07000d 45%,#000 100%);
}

/* =========================
   SPACE BACKGROUND
========================= */

.space{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:0;
}

/* stars */

.star{
  position:absolute;
  border-radius:50%;
  background:white;
  opacity:.7;
  animation:
  twinkle ease-in-out infinite,
  drift linear infinite;
}

@keyframes twinkle{
  0%{opacity:.2;}
  50%{opacity:1;}
  100%{opacity:.2;}
}

@keyframes drift{
  from{
    transform:translateY(0px) translateX(0px);
  }

  to{
    transform:translateY(-140px) translateX(40px);
  }
}

/* nebula */

.nebula{
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  background:
  radial-gradient(circle,
  rgba(176,38,255,.18),
  transparent 70%);
  filter:blur(55px);
  animation:nebulaMove 18s ease-in-out infinite alternate;
}

.nebula.two{
  width:350px;
  height:350px;
  right:5%;
  top:30%;
  animation-duration:24s;
}

@keyframes nebulaMove{
  from{
    transform:translate(0px,0px);
  }

  to{
    transform:translate(50px,-30px);
  }
}

/* planets */

.planet{
  position:absolute;
  border-radius:50%;
  animation:floatPlanet ease-in-out infinite alternate;
}

.planet.one{
  width:120px;
  height:120px;
  top:8%;
  right:10%;

  background:
  radial-gradient(circle at 30% 30%,
  #f1b8ff,
  #7b1dff 65%,
  #2a0059);

  box-shadow:0 0 50px #8f2fff;
  animation-duration:18s;
}

.planet.two{
  width:65px;
  height:65px;
  bottom:12%;
  left:18%;

  background:
  radial-gradient(circle at 30% 30%,
  #8dd3ff,
  #2860ff 65%,
  #001a55);

  box-shadow:0 0 30px #4d8fff;
  animation-duration:12s;
}

.planet.three{
  width:40px;
  height:40px;
  top:58%;
  right:25%;

  background:
  radial-gradient(circle at 30% 30%,
  #ffb3d9,
  #ff318c 65%,
  #5c002c);

  box-shadow:0 0 20px #ff4fa8;
  animation-duration:10s;
}

@keyframes floatPlanet{
  from{
    transform:translateY(0px);
  }

  to{
    transform:translateY(-20px);
  }
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:235px;
  height:100vh;

  background:rgba(10,0,18,.75);

  border-right:
  1px solid rgba(176,38,255,.18);

  backdrop-filter:blur(18px);

  padding:30px 18px;

  z-index:5;
}

.logo{
  font-size:36px;
  font-weight:900;

  color:#cc72ff;

  text-shadow:
  0 0 12px #b026ff,
  0 0 35px #6b00ff;

  margin-bottom:40px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.nav-item{
  padding:14px;
  border-radius:18px;
  cursor:pointer;
  transition:.25s;
  color:#ddd;
}

.nav-item:hover{
  background:rgba(176,38,255,.12);
  transform:translateX(6px);

  box-shadow:
  0 0 20px rgba(176,38,255,.18);
}

/* =========================
   MAIN
========================= */

.main{
  position:relative;
  z-index:2;

  margin-left:235px;

  height:100vh;

  overflow-y:auto;

  padding:45px;
}

/* top */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:25px;

  margin-bottom:40px;
}

.title{
  font-size:52px;
  font-weight:900;

  color:#d16eff;

  text-shadow:
  0 0 15px #b026ff,
  0 0 45px #6f00ff;
}

.time-box{
  background:
  rgba(10,0,18,.7);

  border:
  1px solid rgba(176,38,255,.18);

  padding:18px 24px;

  border-radius:24px;

  backdrop-filter:blur(14px);
}

.clock{
  font-size:34px;
  font-weight:900;
}

.date{
  color:#aaa;
  margin-top:4px;
}

/* search */

.search{
  margin-bottom:40px;
}

.search input{
  width:100%;
  max-width:620px;

  padding:17px 20px;

  border-radius:20px;

  border:none;
  outline:none;

  background:
  rgba(10,0,18,.7);

  border:
  1px solid rgba(176,38,255,.18);

  backdrop-filter:blur(12px);

  color:white;

  font-size:16px;
}

/* games */

.games{
  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(270px,1fr));

  gap:30px;
}

.card{
  position:relative;

  min-height:180px;

  padding:24px;

  border-radius:28px;

  overflow:hidden;

  cursor:pointer;

  transition:.3s;

  background:
  rgba(10,0,18,.7);

  border:
  1px solid rgba(176,38,255,.18);

  backdrop-filter:blur(15px);
}

.card::before{
  content:"";

  position:absolute;

  width:220px;
  height:220px;

  border-radius:50%;

  background:
  radial-gradient(circle,
  rgba(176,38,255,.22),
  transparent 70%);

  top:-80px;
  right:-80px;
}

.card:hover{
  transform:
  translateY(-8px)
  scale(1.02);

  box-shadow:
  0 0 35px rgba(176,38,255,.2);
}

.card h3{
  position:relative;

  font-size:30px;

  color:#d16eff;

  margin-bottom:10px;
}

.card p{
  position:relative;

  color:#aaa;

  line-height:1.6;
}

/* music */

.music{
  margin-top:40px;

  padding:22px;

  border-radius:28px;

  background:
  rgba(10,0,18,.7);

  border:
  1px solid rgba(176,38,255,.18);

  backdrop-filter:blur(15px);
}

.music h3{
  color:#d16eff;
  margin-bottom:15px;
}

audio{
  width:100%;
}

/* mobile */

@media(max-width:850px){

  .sidebar{
    width:90px;
    padding:20px 10px;
  }

  .logo{
    font-size:18px;
  }

  .nav-item{
    font-size:12px;
    padding:10px;
  }

  .main{
    margin-left:90px;
    padding:24px;
  }

  .title{
    font-size:34px;
  }
}

</style>
</head>

<body>

<!-- SPACE -->

<div class="space">

  <!-- stars -->

  <div class="star" style="top:8%;left:15%;width:2px;height:2px;animation-duration:3s,15s;"></div>

  <div class="star" style="top:18%;left:72%;width:3px;height:3px;animation-duration:5s,18s;"></div>

  <div class="star" style="top:34%;left:48%;width:2px;height:2px;animation-duration:4s,14s;"></div>

  <div class="star" style="top:55%;left:80%;width:4px;height:4px;animation-duration:6s,22s;"></div>

  <div class="star" style="top:70%;left:22%;width:2px;height:2px;animation-duration:5s,16s;"></div>

  <div class="star" style="top:88%;left:62%;width:3px;height:3px;animation-duration:7s,20s;"></div>

  <!-- nebula -->

  <div class="nebula"></div>
  <div class="nebula two"></div>

  <!-- planets -->

  <div class="planet one"></div>
  <div class="planet two"></div>
  <div class="planet three"></div>

</div>

<!-- SIDEBAR -->

<div class="sidebar">

  <div class="logo">
    ORBIT
  </div>

  <div class="nav">

    <div class="nav-item">🏠 Home</div>
    <div class="nav-item">🎮 Games</div>
    <div class="nav-item">⭐ Favorites</div>
    <div class="nav-item">🎵 Music</div>
    <div class="nav-item">⚙ Settings</div>

  </div>

</div>

<!-- MAIN -->

<div class="main">

  <!-- TOP -->

  <div class="top">

    <div class="title">
      Orbit Dashboard
    </div>

    <div class="time-box">

      <div class="clock" id="clock"></div>

      <div class="date" id="date"></div>

    </div>

  </div>

  <!-- SEARCH -->

  <div class="search">

    <input
    type="text"
    id="search"
    placeholder="Search games..."
    onkeyup="searchGames()">

  </div>

  <!-- GAMES -->

  <div class="games">

    <div class="card">
      <h3>Action</h3>
      <p>Fast paced gameplay and combat experiences.</p>
    </div>

    <div class="card">
      <h3>Puzzle</h3>
      <p>Logic based brain games and challenges.</p>
    </div>

    <div class="card">
      <h3>Retro</h3>
      <p>Classic arcade inspired experiences.</p>
    </div>

    <div class="card">
      <h3>Arcade</h3>
      <p>High score chasing and quick gameplay.</p>
    </div>

  </div>

  <!-- MUSIC -->

  <div class="music">

    <h3>Music Player</h3>

    <audio controls>
      <source src="music.mp3" type="audio/mpeg">
    </audio>

  </div>

</div>

<script>

/* CLOCK */

function updateClock(){

  const now = new Date();

  const time =
  now.toLocaleTimeString([],{
    hour:'2-digit',
    minute:'2-digit'
  });

  const date =
  now.toLocaleDateString([],{
    weekday:'long',
    month:'short',
    day:'numeric'
  });

  document.getElementById("clock").innerText = time;

  document.getElementById("date").innerText = date;
}

setInterval(updateClock,1000);

updateClock();

/* SEARCH */

function searchGames(){

  const input =
  document
  .getElementById("search")
  .value
  .toLowerCase();

  const cards =
  document.querySelectorAll(".card");

  cards.forEach(card=>{

    const text =
    card.innerText.toLowerCase();

    card.style.display =
    text.includes(input)
    ? "block"
    : "none";

  });

}

</script>

</body>
</html>
