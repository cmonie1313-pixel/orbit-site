<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orbit OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #120018, #000);
  font-family: Arial, sans-serif;
  font-weight: 700;
  color: white;
  height: 100vh;
  overflow: hidden;
}

/* FLOAT ANIMATION */
@keyframes floaty {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-5px); }
  100% { transform: translateY(0px); }
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 220px;
  height: 100%;
  background: #0a0010;
  border-right: 1px solid #2a003f;
  padding: 20px;
}

.logo {
  font-size: 28px;
  color: #b026ff;
  text-shadow: 0 0 20px #b026ff;
  font-weight: 900;
  animation: floaty 3.5s infinite ease-in-out;
  margin-bottom: 25px;
}

.nav-item {
  padding: 10px;
  margin: 10px 0;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.nav-item:hover {
  background: #1a0026;
  box-shadow: 0 0 15px #b026ff;
}

/* MAIN */
.main {
  margin-left: 220px;
  padding: 20px;
}

/* TOP */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-size: 32px;
  color: #b026ff;
  text-shadow: 0 0 20px #b026ff;
  animation: floaty 4s infinite ease-in-out;
  font-weight: 900;
}

/* START BUTTON */
.start-btn {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 100;
  background: #0a0010;
  border: 1px solid #b026ff;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
}

/* START MENU */
.start-menu {
  position: fixed;
  top: 60px;
  left: 15px;
  width: 180px;
  background: #0a0010;
  border: 1px solid #2a003f;
  padding: 10px;
  display: none;
  border-radius: 12px;
  z-index: 100;
}

.start-item {
  padding: 8px;
  border-radius: 8px;
}

.start-item:hover {
  background: #1a0026;
}

/* SEARCH */
.search {
  margin: 20px 0;
  text-align: center;
}

.search input {
  width: 60%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #b026ff;
  background: #0a0010;
  color: white;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

/* CARD */
.card {
  background: #0a0010;
  border: 1px solid #2a003f;
  border-radius: 15px;
  padding: 18px;
  cursor: pointer;
  transition: 0.25s;
  animation: floaty 5s infinite ease-in-out;
}

.card:hover {
  transform: translateY(-8px);
  border: 1px solid #b026ff;
  box-shadow: 0 0 25px #b026ff;
}

.card h3 {
  margin: 0;
  color: #b026ff;
  font-weight: 900;
}

/* MUSIC */
.music {
  margin-top: 25px;
  padding: 15px;
  border-radius: 15px;
  background: #0a0010;
  border: 1px solid #2a003f;
  animation: floaty 6s infinite ease-in-out;
}

audio {
  width: 100%;
  margin-top: 10px;
}
</style>
</head>

<body>

<button class="start-btn" onclick="toggleMenu()">☰</button>

<div class="start-menu" id="menu">
  <div class="start-item">🏠 Home</div>
  <div class="start-item">🎮 Games</div>
  <div class="start-item">🔥 Trending</div>
  <div class="start-item">⭐ Favorites</div>
</div>

<div class="sidebar">
  <div class="logo">ORBIT</div>
  <div class="nav-item">Home</div>
  <div class="nav-item">Games</div>
  <div class="nav-item">Trending</div>
  <div class="nav-item">Music</div>
</div>

<div class="main">

  <div class="topbar">
    <div class="title">Orbit Dashboard</div>
  </div>

  <div class="search">
    <input id="search" placeholder="Search games..." onkeyup="searchGames()">
  </div>

  <div class="grid">

    <div class="card">
      <h3>Action Game</h3>
    </div>

    <div class="card">
      <h3>Puzzle Game</h3>
    </div>

    <div class="card">
      <h3>Retro Game</h3>
    </div>

    <div class="card">
      <h3>Arcade</h3>
    </div>

  </div>

  <div class="music">
    <h3 style="color:#b026ff; font-weight:900;">Music Player</h3>
    <audio controls></audio>
  </div>

</div>

<script>
function toggleMenu() {
  const menu = document.getElementById("menu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function searchGames() {
  const input = document.getElementById("search").value.toLowerCase();
  const cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    card.style.display =
      card.innerText.toLowerCase().includes(input)
        ? "block"
        : "none";
  });
}
</script>

</body>
</html>
